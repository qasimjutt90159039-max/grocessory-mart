<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <radialGradient id="studioFloor" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>
    <radialGradient id="scaleShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.35)" />
      <stop offset="65%" stop-color="rgba(15, 23, 42, 0.1)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)" />
    </radialGradient>
    <!-- Brushed Deep-Drawn Stainless Steel Pan Gradient -->
    <linearGradient id="deepStainless" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="15%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="85%" stop-color="#94A3B8" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>
    <linearGradient id="bodyMoldedWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F8FAFC" />
      <stop offset="80%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Studio Floor -->
  <rect width="800" height="650" fill="url(#studioFloor)"/>

  <!-- Contact & Ambient Shadows -->
  <ellipse cx="400" cy="550" rx="310" ry="30" fill="url(#scaleShadow)"/>
  <ellipse cx="400" cy="545" rx="240" ry="16" fill="rgba(15, 23, 42, 0.45)"/>

  <!-- Leveling Feet -->
  <rect x="160" y="525" width="45" height="15" rx="4" fill="#0F172A"/>
  <rect x="595" y="525" width="45" height="15" rx="4" fill="#0F172A"/>

  <!-- Main ABS Scale Body Chassis -->
  <polygon points="180,310 620,310 660,520 140,520" fill="url(#bodyMoldedWhite)" stroke="#94A3B8" stroke-width="2"/>
  <rect x="140" y="520" width="520" height="18" rx="4" fill="#475569"/>

  <!-- Circular Spirit Level Bubble -->
  <circle cx="210" cy="370" r="14" fill="#E2E8F0" stroke="#31AAA9" stroke-width="2"/>
  <circle cx="210" cy="370" r="11" fill="#F8FAFC"/>
  <circle cx="210" cy="370" r="4" fill="#22C55E"/>

  <!-- Removable 304 Stainless Steel Weighing Tray -->
  <polygon points="150,240 650,240 630,320 170,320" fill="url(#deepStainless)" stroke="#64748B" stroke-width="2"/>
  <!-- Polished Tray Rim Specular Line -->
  <line x1="150" y1="240" x2="650" y2="240" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <polygon points="150,240 650,240 655,248 145,248" fill="#94A3B8"/>

  <!-- Front Operator Display Windows: Weight, Unit Price, Total Price -->
  <!-- Window 1: Weight -->
  <rect x="180" y="340" width="135" height="56" rx="6" fill="#050505" stroke="#31AAA9" stroke-width="2"/>
  <polygon points="180,340 240,340 210,396 180,396" fill="#FFFFFF" opacity="0.08"/>
  <text x="188" y="356" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="bold">WEIGHT (kg)</text>
  <g filter="url(#greenGlow)">
    <text x="306" y="386" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" text-anchor="end">2.500</text>
  </g>

  <!-- Window 2: Unit Price -->
  <rect x="330" y="340" width="140" height="56" rx="6" fill="#050505" stroke="#31AAA9" stroke-width="2"/>
  <polygon points="330,340 390,340 360,396 330,396" fill="#FFFFFF" opacity="0.08"/>
  <text x="338" y="356" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="bold">UNIT PRICE (PKR)</text>
  <g filter="url(#greenGlow)">
    <text x="460" y="386" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" text-anchor="end">350.00</text>
  </g>

  <!-- Window 3: Total Price -->
  <rect x="485" y="340" width="140" height="56" rx="6" fill="#050505" stroke="#31AAA9" stroke-width="2"/>
  <polygon points="485,340 545,340 515,396 485,396" fill="#FFFFFF" opacity="0.08"/>
  <text x="493" y="356" fill="#38BDF8" font-family="sans-serif" font-size="9" font-weight="bold">TOTAL (PKR)</text>
  <text x="615" y="386" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="900" text-anchor="end">875.00</text>

  <!-- Membrane Keyboard Array with Real Button Bevels -->
  <g transform="translate(180, 415)">
    <!-- Numeric keys & function keys -->
    <!-- Row 1 -->
    <rect x="0" y="0" width="36" height="22" rx="4" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
    <text x="18" y="15" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">7</text>
    <rect x="45" y="0" width="36" height="22" rx="4" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
    <text x="63" y="15" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">8</text>
    <rect x="90" y="0" width="36" height="22" rx="4" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
    <text x="108" y="15" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">9</text>
    <rect x="135" y="0" width="46" height="22" rx="4" fill="#16706F" stroke="#0F172A" stroke-width="1.5"/>
    <text x="158" y="15" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">TARE</text>
    <rect x="190" y="0" width="46" height="22" rx="4" fill="#0284C7" stroke="#0F172A" stroke-width="1.5"/>
    <text x="213" y="15" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">M1</text>
    <rect x="245" y="0" width="46" height="22" rx="4" fill="#0284C7" stroke="#0F172A" stroke-width="1.5"/>
    <text x="268" y="15" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">M2</text>

    <!-- Row 2 -->
    <rect x="0" y="30" width="36" height="22" rx="4" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
    <text x="18" y="45" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">4</text>
    <rect x="45" y="30" width="36" height="22" rx="4" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
    <text x="63" y="45" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">5</text>
    <rect x="90" y="30" width="36" height="22" rx="4" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
    <text x="108" y="45" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">6</text>
    <rect x="135" y="30" width="46" height="22" rx="4" fill="#16706F" stroke="#0F172A" stroke-width="1.5"/>
    <text x="158" y="45" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">ZERO</text>
    <rect x="190" y="30" width="46" height="22" rx="4" fill="#0284C7" stroke="#0F172A" stroke-width="1.5"/>
    <text x="213" y="45" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">M3</text>
    <rect x="245" y="30" width="46" height="22" rx="4" fill="#0284C7" stroke="#0F172A" stroke-width="1.5"/>
    <text x="268" y="45" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">M4</text>

    <!-- Row 3 -->
    <rect x="0" y="60" width="36" height="22" rx="4" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
    <text x="18" y="75" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">1</text>
    <rect x="45" y="60" width="36" height="22" rx="4" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
    <text x="63" y="75" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">2</text>
    <rect x="90" y="60" width="36" height="22" rx="4" fill="#334155" stroke="#1E293B" stroke-width="1.5"/>
    <text x="108" y="75" fill="#FFF" font-size="12" font-weight="bold" text-anchor="middle">3</text>
    <rect x="135" y="60" width="46" height="22" rx="4" fill="#DC2626" stroke="#0F172A" stroke-width="1.5"/>
    <text x="158" y="75" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">CLR</text>
    <rect x="190" y="60" width="101" height="22" rx="4" fill="#16A34A" stroke="#0F172A" stroke-width="1.5"/>
    <text x="240" y="75" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">ADD ACCUMULATE</text>
  </g>

  <!-- Technical Brand Label -->
  <g transform="translate(400, 150)">
    <text x="0" y="0" fill="#16706F" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" letter-spacing="1.5">ACS COMMERCIAL PRICE COMPUTING SCALE</text>
    <text x="0" y="20" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">AALIYAN TRADER'S SCALES · CHOWK SHAHEEDAN, MULTAN</text>
  </g>
</svg>
