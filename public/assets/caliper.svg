<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="steelBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="500" fill="#F8FAFC"/>

  <!-- Main Beam Bar -->
  <rect x="100" y="240" width="440" height="35" rx="3" fill="url(#steelBar)" stroke="#475569" stroke-width="1.5"/>

  <!-- Ruler Markings on Beam -->
  <g stroke="#334155" stroke-width="1">
    <line x1="280" y1="240" x2="280" y2="252"/>
    <line x1="290" y1="240" x2="290" y2="246"/>
    <line x1="300" y1="240" x2="300" y2="246"/>
    <line x1="310" y1="240" x2="310" y2="246"/>
    <line x1="320" y1="240" x2="320" y2="252"/>
    <line x1="330" y1="240" x2="330" y2="246"/>
    <line x1="340" y1="240" x2="340" y2="246"/>
    <line x1="350" y1="240" x2="350" y2="246"/>
    <line x1="360" y1="240" x2="360" y2="252"/>
    <line x1="370" y1="240" x2="370" y2="246"/>
    <line x1="380" y1="240" x2="380" y2="246"/>
    <line x1="390" y1="240" x2="390" y2="246"/>
    <line x1="400" y1="240" x2="400" y2="252"/>
    <line x1="440" y1="240" x2="440" y2="252"/>
    <line x1="480" y1="240" x2="480" y2="252"/>
    <line x1="520" y1="240" x2="520" y2="252"/>
  </g>

  <!-- Static Main External Jaw -->
  <polygon points="100,240 100,380 120,380 120,275 140,275 140,240" fill="url(#steelBar)" stroke="#475569" stroke-width="1.5"/>
  <!-- Static Upper Internal Jaw -->
  <polygon points="100,240 100,160 115,160 125,240" fill="url(#steelBar)" stroke="#475569" stroke-width="1.5"/>

  <!-- Sliding Sensor Housing Block -->
  <rect x="200" y="215" width="115" height="85" rx="6" fill="#1E293B" stroke="#31AAA9" stroke-width="2"/>
  <!-- Movable External Jaw -->
  <polygon points="200,300 200,380 180,380 180,240 200,240" fill="url(#steelBar)" stroke="#475569" stroke-width="1.5"/>
  <!-- Movable Internal Jaw -->
  <polygon points="200,215 200,160 185,160 175,240 200,240" fill="url(#steelBar)" stroke="#475569" stroke-width="1.5"/>

  <!-- Digital LCD Readout Screen -->
  <rect x="210" y="225" width="95" height="34" rx="4" fill="#000000"/>
  <text x="290" y="250" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" text-anchor="end">25.40</text>
  <text x="295" y="240" fill="#38BDF8" font-size="8">mm</text>

  <!-- Control Buttons (Zero, Unit, Power) -->
  <circle cx="225" cy="275" r="7" fill="#DC2626"/>
  <text x="225" y="278" fill="#FFFFFF" font-size="5" font-weight="bold" text-anchor="middle">OFF</text>
  <circle cx="255" cy="275" r="7" fill="#31AAA9"/>
  <text x="255" y="278" fill="#FFFFFF" font-size="5" font-weight="bold" text-anchor="middle">ZERO</text>
  <circle cx="285" cy="275" r="7" fill="#334155"/>
  <text x="285" y="278" fill="#FFFFFF" font-size="5" font-weight="bold" text-anchor="middle">IN/MM</text>

  <!-- Thumb Roller -->
  <rect x="305" y="272" width="12" height="20" rx="3" fill="#64748B"/>

  <text x="300" y="100" fill="#16706F" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">DIGITAL VERNIER CALIPER &amp; GAUGE</text>
  <text x="300" y="120" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">0.01mm RESOLUTION • HARDENED STAINLESS STEEL</text>
</svg>
