<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hammerTeal" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#31AAA9"/>
      <stop offset="100%" stop-color="#16706F"/>
    </linearGradient>
    <linearGradient id="darkMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="500" fill="#F8FAFC"/>
  <ellipse cx="320" cy="435" rx="200" ry="16" fill="#0F172A" opacity="0.12"/>

  <!-- SDS-Plus Chuck System & Heavy Drill Bit -->
  <polygon points="50,210 110,205 110,215" fill="#64748B"/>
  <line x1="60" y1="210" x2="110" y2="210" stroke="#94A3B8" stroke-width="4"/>
  <!-- Heavy Rubber Dust Cap & Collar -->
  <rect x="110" y="195" width="35" height="30" rx="4" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <rect x="145" y="190" width="45" height="40" rx="3" fill="url(#darkMetal)" stroke="#0F172A" stroke-width="2"/>

  <!-- Magnesium Alloy Heavy Gearbox -->
  <polygon points="190,175 280,165 285,250 190,245" fill="url(#darkMetal)" stroke="#0F172A" stroke-width="2"/>
  <!-- Mode Selector Dial (Drill / Hammer / Chisel) -->
  <circle cx="235" cy="210" r="16" fill="#DC2626" stroke="#0F172A" stroke-width="2"/>
  <rect x="230" y="198" width="10" height="8" rx="2" fill="#FFFFFF"/>

  <!-- Main Motor Body (ATS Teal) -->
  <path d="M280,165 L460,165 Q480,165 475,225 L475,260 Q475,280 450,285 L350,285 L350,245 L285,245 Z" fill="url(#hammerTeal)" stroke="#0F172A" stroke-width="2.5"/>

  <!-- Motor Ventilation Louvers -->
  <g stroke="#0F172A" stroke-width="3" stroke-linecap="round">
    <line x1="390" y1="185" x2="450" y2="185"/>
    <line x1="390" y1="198" x2="450" y2="198"/>
    <line x1="390" y1="211" x2="450" y2="211"/>
    <line x1="390" y1="224" x2="450" y2="224"/>
  </g>

  <!-- D-Handle Shock-Absorbing Rear Grip -->
  <path d="M350,285 L430,285 Q470,290 460,395 Q450,425 410,420 L370,420 Q330,420 330,380 L320,310 Z" fill="#1E293B" stroke="#0F172A" stroke-width="2.5"/>
  <!-- Inner Loop Cutout for Hand -->
  <rect x="365" y="315" width="45" height="75" rx="8" fill="#F8FAFC"/>

  <!-- Variable Trigger Switch -->
  <rect x="350" y="325" width="16" height="30" rx="3" fill="#DC2626"/>

  <!-- Heavy 360-degree Auxiliary Front Handle with Depth Rod -->
  <rect x="180" y="160" width="20" height="95" rx="4" fill="#0F172A"/>
  <rect x="175" y="255" width="30" height="90" rx="8" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  <line x1="70" y1="160" x2="310" y2="160" stroke="#CBD5E1" stroke-width="3.5"/>

  <!-- Technical Branding -->
  <text x="320" y="100" fill="#16706F" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" letter-spacing="1">INDUSTRIAL 26mm SDS-PLUS ROTARY HAMMER</text>
  <text x="320" y="120" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">850W HIGH IMPACT • CONCRETE &amp; MASONRY SPEC</text>
</svg>
