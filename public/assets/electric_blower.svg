<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <radialGradient id="blowerStudioLight" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>
    <radialGradient id="blowerShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.35)" />
      <stop offset="70%" stop-color="rgba(15, 23, 42, 0.08)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)" />
    </radialGradient>
    <linearGradient id="blowerTealPlastic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31AAA9"/>
      <stop offset="50%" stop-color="#16706F"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
    <linearGradient id="flexibleRubber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="650" fill="url(#blowerStudioLight)"/>
  <ellipse cx="430" cy="540" rx="270" ry="24" fill="url(#blowerShadow)"/>
  <ellipse cx="430" cy="535" rx="190" ry="14" fill="rgba(15, 23, 42, 0.45)"/>

  <!-- Centrifugal Volute Turbine Housing -->
  <circle cx="480" cy="350" r="140" fill="url(#blowerTealPlastic)" stroke="#0F172A" stroke-width="3.5"/>
  <circle cx="480" cy="350" r="115" fill="#16706F" opacity="0.3"/>

  <!-- Radial Air Intake Screen & Fan Hub -->
  <circle cx="480" cy="350" r="65" fill="#0F172A" stroke="#1E293B" stroke-width="3"/>
  <g stroke="#31AAA9" stroke-width="3" stroke-linecap="round">
    <line x1="480" y1="300" x2="480" y2="400"/>
    <line x1="430" y1="350" x2="530" y2="350"/>
    <line x1="445" y1="315" x2="515" y2="385"/>
    <line x1="445" y1="385" x2="515" y2="315"/>
  </g>
  <circle cx="480" cy="350" r="20" fill="#334155"/>

  <!-- Rear Motor Cylinder Housing -->
  <rect x="560" y="270" width="100" height="160" rx="16" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
  <g stroke="#475569" stroke-width="3" stroke-linecap="round">
    <line x1="580" y1="300" x2="640" y2="300"/>
    <line x1="580" y1="325" x2="640" y2="325"/>
    <line x1="580" y1="350" x2="640" y2="350"/>
    <line x1="580" y1="375" x2="640" y2="375"/>
    <line x1="580" y1="400" x2="640" y2="400"/>
  </g>

  <!-- Top Handle Loop with Trigger & Lock-On Switch -->
  <path d="M400,260 C400,150 580,150 580,270" fill="none" stroke="#0F172A" stroke-width="34" stroke-linecap="round"/>
  <path d="M400,260 C400,150 580,150 580,270" fill="none" stroke="url(#blowerTealPlastic)" stroke-width="24" stroke-linecap="round"/>

  <!-- Power Trigger Switch Inside Handle -->
  <rect x="475" y="210" width="30" height="16" rx="4" fill="#DC2626"/>
  <circle cx="525" cy="218" r="6" fill="#F59E0B" stroke="#0F172A" stroke-width="1.5"/>

  <!-- Discharge Port & Long Rubber Concentrator Nozzle -->
  <polygon points="370,330 370,420 100,390 100,360" fill="url(#flexibleRubber)" stroke="#0F172A" stroke-width="3"/>
  <ellipse cx="100" cy="375" rx="8" ry="15" fill="#020617"/>

  <!-- Bayonet Quick-Clamp Ring on Nozzle -->
  <rect x="350" y="325" width="32" height="100" rx="6" fill="#64748B" stroke="#1E293B" stroke-width="2"/>
  <circle cx="366" cy="375" r="5" fill="#FFFFFF"/>

  <!-- Heavy Power Cord Boot -->
  <path d="M600,430 L620,490 Q620,520 660,530" fill="none" stroke="#0F172A" stroke-width="14" stroke-linecap="round"/>

  <!-- Studio Header Overlay -->
  <g transform="translate(400, 100)">
    <text x="0" y="0" fill="#16706F" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold" text-anchor="middle" letter-spacing="1.5">PROFESSIONAL WORKSHOP ELECTRIC AIR BLOWER</text>
    <text x="0" y="20" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">DUAL BLOW &amp; VACUUM MODES • WEIGHING SCALE CLEANING SPEC</text>
  </g>
</svg>
