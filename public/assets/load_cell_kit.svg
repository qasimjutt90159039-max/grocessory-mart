<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="loadAlloy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="500" fill="#F8FAFC"/>

  <!-- S-Type Industrial Load Cell (Left) -->
  <path d="M120,180 L220,180 L220,225 L160,225 L160,275 L220,275 L220,320 L120,320 L120,275 L180,275 L180,225 L120,225 Z" fill="url(#loadAlloy)" stroke="#334155" stroke-width="2.5"/>
  <circle cx="170" cy="195" r="7" fill="#0F172A"/>
  <circle cx="170" cy="305" r="7" fill="#0F172A"/>

  <!-- High-Precision Parallel Beam Load Cell (Center) -->
  <rect x="250" y="220" width="220" height="60" rx="4" fill="url(#loadAlloy)" stroke="#334155" stroke-width="2"/>
  <!-- Central double-hole strain flexure aperture -->
  <circle cx="330" cy="250" r="14" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <circle cx="390" cy="250" r="14" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  <rect x="330" y="247" width="60" height="6" fill="#F8FAFC"/>
  <!-- Mounting Threaded Holes -->
  <circle cx="270" cy="235" r="5" fill="#334155"/>
  <circle cx="270" cy="265" r="5" fill="#334155"/>
  <circle cx="450" cy="235" r="5" fill="#334155"/>
  <circle cx="450" cy="265" r="5" fill="#334155"/>

  <!-- Shielded 4-Wire Instrumentation Cable -->
  <path d="M470,250 C520,250 500,340 430,360 C380,370 300,350 260,380" fill="none" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
  <!-- Cable gland -->
  <rect x="465" y="242" width="14" height="16" rx="2" fill="#0F172A"/>

  <!-- High-Speed ADC Sensor Signal Transmitter Board (Bottom Left) -->
  <rect x="120" y="350" width="120" height="75" rx="6" fill="#166534" stroke="#0F172A" stroke-width="2"/>
  <!-- Microchip & terminals -->
  <rect x="155" y="370" width="30" height="30" rx="3" fill="#0F172A"/>
  <rect x="130" y="355" width="20" height="12" fill="#0284C7"/>
  <rect x="210" y="355" width="20" height="12" fill="#0284C7"/>

  <!-- Technical Branding -->
  <text x="300" y="100" fill="#16706F" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">INDUSTRIAL LOAD CELL SENSOR REPLACEMENT KIT</text>
  <text x="300" y="120" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">SHEAR BEAM &amp; S-TYPE SENSORS • HIGH PRECISION RE-CALIBRATION</text>
</svg>
