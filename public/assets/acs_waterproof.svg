<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ssPan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#E2E8F0"/>
      <stop offset="70%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="sealBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
  </defs>

  <rect width="600" height="500" fill="#F8FAFC"/>
  <ellipse cx="300" cy="425" rx="200" ry="22" fill="#0F172A" opacity="0.12"/>

  <!-- Sealed IP68 Stainless Steel Scale Body -->
  <polygon points="110,230 490,230 520,395 80,395" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  <rect x="80" y="395" width="440" height="18" rx="4" fill="#334155"/>

  <!-- Stainless Steel Deep Dish Weighing Pan with Drainage Lip -->
  <polygon points="90,185 510,185 490,235 110,235" fill="url(#ssPan)" stroke="#475569" stroke-width="2"/>
  <ellipse cx="300" cy="186" rx="210" ry="8" fill="#FFFFFF" opacity="0.8"/>

  <!-- Waterproof Rubber Keypad Seal Strip -->
  <rect x="110" y="315" width="380" height="65" rx="6" fill="#1E293B"/>

  <!-- Dual LED Windows: Weight, Unit Price, Total -->
  <rect x="120" y="255" width="105" height="48" rx="4" fill="#000" stroke="#0284C7" stroke-width="1.5"/>
  <text x="126" y="270" fill="#38BDF8" font-family="sans-serif" font-size="8" font-weight="bold">WEIGHT (kg)</text>
  <text x="218" y="295" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="bold" text-anchor="end">4.825</text>

  <rect x="245" y="255" width="110" height="48" rx="4" fill="#000" stroke="#0284C7" stroke-width="1.5"/>
  <text x="251" y="270" fill="#38BDF8" font-family="sans-serif" font-size="8" font-weight="bold">UNIT PRICE</text>
  <text x="348" y="295" fill="#22C55E" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="bold" text-anchor="end">420.00</text>

  <rect x="375" y="255" width="110" height="48" rx="4" fill="#000" stroke="#0284C7" stroke-width="1.5"/>
  <text x="381" y="270" fill="#38BDF8" font-family="sans-serif" font-size="8" font-weight="bold">TOTAL (PKR)</text>
  <text x="478" y="295" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="bold" text-anchor="end">2026.5</text>

  <!-- Waterproof Silicone Membrane Keys -->
  <g transform="translate(125, 325)">
    <rect x="0" y="0" width="28" height="18" rx="3" fill="#334155"/>
    <text x="14" y="13" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">7</text>
    <rect x="36" y="0" width="28" height="18" rx="3" fill="#334155"/>
    <text x="50" y="13" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">8</text>
    <rect x="72" y="0" width="28" height="18" rx="3" fill="#334155"/>
    <text x="86" y="13" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">9</text>
    <rect x="108" y="0" width="34" height="18" rx="3" fill="#0284C7"/>
    <text x="125" y="13" fill="#FFF" font-size="8" font-weight="bold" text-anchor="middle">TARE</text>
    <rect x="150" y="0" width="34" height="18" rx="3" fill="#16706F"/>
    <text x="167" y="13" fill="#FFF" font-size="8" font-weight="bold" text-anchor="middle">ZERO</text>

    <rect x="0" y="26" width="28" height="18" rx="3" fill="#334155"/>
    <text x="14" y="39" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">4</text>
    <rect x="36" y="26" width="28" height="18" rx="3" fill="#334155"/>
    <text x="50" y="39" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">5</text>
    <rect x="72" y="26" width="28" height="18" rx="3" fill="#334155"/>
    <text x="86" y="39" fill="#FFF" font-size="10" font-weight="bold" text-anchor="middle">6</text>
    <rect x="108" y="26" width="34" height="18" rx="3" fill="#DC2626"/>
    <text x="125" y="39" fill="#FFF" font-size="8" font-weight="bold" text-anchor="middle">CLR</text>
    <rect x="150" y="26" width="34" height="18" rx="3" fill="#16A34A"/>
    <text x="167" y="39" fill="#FFF" font-size="8" font-weight="bold" text-anchor="middle">ADD</text>
  </g>

  <!-- Waterproof Seal Badge -->
  <text x="300" y="100" fill="#0369A1" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">ACS 40KG WATERPROOF PRICE COMPUTING SCALE</text>
  <text x="300" y="120" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">SEALED INTERNAL BOARD • MEAT &amp; POULTRY SHOP GRADE</text>
</svg>
