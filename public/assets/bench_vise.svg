<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ironGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <rect width="600" height="500" fill="#F8FAFC"/>
  <ellipse cx="300" cy="425" rx="190" ry="18" fill="#0F172A" opacity="0.12"/>

  <!-- Swivel Base Plate -->
  <polygon points="120,400 480,400 450,425 150,425" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  <circle cx="200" cy="412" r="6" fill="#F8FAFC"/>
  <circle cx="400" cy="412" r="6" fill="#F8FAFC"/>

  <!-- Static Body with Anvil Surface -->
  <path d="M260,260 L450,260 L450,400 L260,400 Z" fill="url(#ironGrad)" stroke="#0F172A" stroke-width="2"/>
  <!-- Machined Anvil Top -->
  <polygon points="320,240 450,240 450,260 320,260" fill="#CBD5E1" stroke="#475569" stroke-width="1.5"/>

  <!-- Fixed Jaw Block -->
  <polygon points="260,180 320,180 320,260 260,260" fill="url(#ironGrad)" stroke="#0F172A" stroke-width="2"/>
  <rect x="250" y="180" width="10" height="40" fill="#E2E8F0" stroke="#0F172A" stroke-width="1"/>

  <!-- Movable Jaw Slide -->
  <polygon points="140,180 200,180 200,320 140,320" fill="url(#ironGrad)" stroke="#0F172A" stroke-width="2"/>
  <rect x="200" y="180" width="10" height="40" fill="#E2E8F0" stroke="#0F172A" stroke-width="1"/>

  <!-- Slide Guide Bar & Screw -->
  <rect x="195" y="270" width="120" height="30" fill="#94A3B8" stroke="#334155" stroke-width="2"/>
  <!-- Handle Hub & Tommy Bar -->
  <circle cx="110" cy="285" r="22" fill="#64748B" stroke="#1E293B" stroke-width="2"/>
  <rect x="103" y="160" width="14" height="250" rx="7" fill="#CBD5E1" stroke="#475569" stroke-width="2"/>
  <circle cx="110" cy="165" r="10" fill="#1E293B"/>
  <circle cx="110" cy="405" r="10" fill="#1E293B"/>

  <text x="300" y="100" fill="#16706F" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">HEAVY WORKSHOP BENCH VISE</text>
  <text x="300" y="120" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">DUCTILE IRON • 360° SWIVEL LOCK BASE</text>
</svg>
