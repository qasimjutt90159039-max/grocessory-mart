<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <rect width="600" height="500" fill="#F8FAFC"/>
  <ellipse cx="300" cy="410" rx="160" ry="16" fill="#0F172A" opacity="0.1"/>

  <!-- Sleek Slimline Kitchen Scale Body -->
  <rect x="160" y="160" width="280" height="230" rx="28" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="165" y="165" width="270" height="220" rx="24" fill="#F8FAFC"/>

  <!-- Tempered Glass / Brushed Top Platform -->
  <rect x="180" y="180" width="240" height="130" rx="16" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1"/>
  <circle cx="300" cy="245" r="45" fill="none" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- LCD Screen Window -->
  <rect x="220" y="325" width="160" height="42" rx="6" fill="#0F172A" stroke="#31AAA9" stroke-width="1.5"/>
  <text x="360" y="355" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="24" font-weight="bold" text-anchor="end">1250</text>
  <text x="372" y="345" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold">g</text>

  <!-- Touch Sensors (Unit & Tare/Power) -->
  <circle cx="195" cy="346" r="14" fill="#334155"/>
  <text x="195" y="349" fill="#FFFFFF" font-size="8" font-weight="bold" text-anchor="middle">UNIT</text>

  <circle cx="405" cy="346" r="14" fill="#16706F"/>
  <text x="405" y="349" fill="#FFFFFF" font-size="8" font-weight="bold" text-anchor="middle">TARE</text>

  <!-- Technical Branding -->
  <text x="300" y="110" fill="#16706F" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">ELECTRONIC DIGITAL KITCHEN &amp; FOOD SCALE</text>
  <text x="300" y="130" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">1g GRADUATION • ULTRA-SLIM PROFILE</text>
</svg>
