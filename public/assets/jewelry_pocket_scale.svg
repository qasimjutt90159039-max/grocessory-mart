<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pocketCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="goldPan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>

  <rect width="600" height="500" fill="#F8FAFC"/>
  <ellipse cx="300" cy="415" rx="170" ry="16" fill="#0F172A" opacity="0.12"/>

  <!-- Open Flip Cover (Left) -->
  <polygon points="120,170 240,170 240,390 120,390" fill="url(#pocketCover)" stroke="#475569" stroke-width="2"/>
  <rect x="130" y="180" width="100" height="200" rx="6" fill="#1E293B" opacity="0.5"/>

  <!-- Pocket Scale Main Body (Right) -->
  <rect x="240" y="170" width="240" height="220" rx="14" fill="url(#pocketCover)" stroke="#475569" stroke-width="2"/>

  <!-- Stainless Steel Weighing Platform (Top Right) -->
  <rect x="260" y="190" width="200" height="110" rx="8" fill="url(#goldPan)" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- High-Precision Blue Backlit LCD Readout (Bottom Right) -->
  <rect x="260" y="315" width="120" height="40" rx="5" fill="#0284C7" stroke="#38BDF8" stroke-width="1"/>
  <text x="365" y="343" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="900" text-anchor="end">12.54</text>
  <text x="372" y="332" fill="#FFFFFF" font-size="8" font-weight="bold">g</text>

  <!-- Control Buttons (Tare, Unit, Power) -->
  <g transform="translate(395, 315)">
    <rect x="0" y="0" width="28" height="18" rx="3" fill="#475569"/>
    <text x="14" y="12" fill="#FFF" font-size="7" font-weight="bold" text-anchor="middle">MODE</text>
    <rect x="35" y="0" width="28" height="18" rx="3" fill="#16706F"/>
    <text x="49" y="12" fill="#FFF" font-size="7" font-weight="bold" text-anchor="middle">TARE</text>
    <rect x="0" y="22" width="28" height="18" rx="3" fill="#0284C7"/>
    <text x="14" y="34" fill="#FFF" font-size="7" font-weight="bold" text-anchor="middle">PCS</text>
    <rect x="35" y="22" width="28" height="18" rx="3" fill="#DC2626"/>
    <text x="49" y="34" fill="#FFF" font-size="7" font-weight="bold" text-anchor="middle">PWR</text>
  </g>

  <!-- Technical Branding -->
  <text x="300" y="110" fill="#16706F" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">PRECISION DIGITAL POCKET GRAM SCALE</text>
  <text x="300" y="130" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">200g / 0.01g RESOLUTION • JEWELRY &amp; LAB SPEC</text>
</svg>
