<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="silverPlate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>

  <rect width="600" height="500" fill="#F8FAFC"/>
  <ellipse cx="300" cy="410" rx="180" ry="18" fill="#0F172A" opacity="0.1"/>

  <!-- Main Base -->
  <polygon points="150,260 450,260 480,390 120,390" fill="#FFFFFF" stroke="#94A3B8" stroke-width="2"/>
  <rect x="120" y="390" width="360" height="12" rx="2" fill="#64748B"/>

  <!-- Leveling feet & spirit bubble -->
  <rect x="140" y="402" width="24" height="8" rx="2" fill="#1E293B"/>
  <rect x="436" y="402" width="24" height="8" rx="2" fill="#1E293B"/>
  <circle cx="160" cy="290" r="10" fill="#E2E8F0" stroke="#31AAA9" stroke-width="1.5"/>
  <circle cx="160" cy="290" r="3" fill="#22C55E"/>

  <!-- Round Stainless Steel Weighing Pan with Stem -->
  <rect x="290" y="220" width="20" height="40" fill="#64748B"/>
  <ellipse cx="300" cy="220" rx="130" ry="35" fill="url(#silverPlate)" stroke="#475569" stroke-width="2"/>
  <ellipse cx="300" cy="220" rx="115" ry="30" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6"/>

  <!-- Windshield Acrylic Draft Enclosure Frame (Subtle) -->
  <path d="M150,140 L450,140 L450,260 L150,260 Z" fill="rgba(221, 246, 245, 0.2)" stroke="#31AAA9" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Backlit Digital LCD Display Window -->
  <rect x="190" y="315" width="220" height="50" rx="4" fill="#0F172A" stroke="#31AAA9" stroke-width="1.5"/>
  <text x="390" y="352" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="bold" text-anchor="end">245.82</text>
  <text x="395" y="335" fill="#38BDF8" font-family="sans-serif" font-size="10" font-weight="bold">g</text>

  <!-- Membrane Function Keys -->
  <g transform="translate(195, 372)">
    <rect x="0" y="0" width="40" height="12" rx="2" fill="#334155"/>
    <text x="20" y="9" fill="#FFFFFF" font-size="7" font-weight="bold" text-anchor="middle">ON/OFF</text>

    <rect x="55" y="0" width="40" height="12" rx="2" fill="#16706F"/>
    <text x="75" y="9" fill="#FFFFFF" font-size="7" font-weight="bold" text-anchor="middle">TARE</text>

    <rect x="110" y="0" width="40" height="12" rx="2" fill="#334155"/>
    <text x="130" y="9" fill="#FFFFFF" font-size="7" font-weight="bold" text-anchor="middle">UNIT</text>

    <rect x="165" y="0" width="45" height="12" rx="2" fill="#0284C7"/>
    <text x="187" y="9" fill="#FFFFFF" font-size="7" font-weight="bold" text-anchor="middle">COUNT (PCS)</text>
  </g>

  <!-- Technical Heading -->
  <text x="300" y="90" fill="#16706F" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">PRECISION ELECTRONIC TABLETOP BALANCE</text>
</svg>
