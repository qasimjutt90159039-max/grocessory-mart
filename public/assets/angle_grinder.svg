<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="grindTeal" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#31AAA9"/>
      <stop offset="100%" stop-color="#16706F"/>
    </linearGradient>
  </defs>

  <rect width="600" height="500" fill="#F8FAFC"/>
  <ellipse cx="320" cy="410" rx="190" ry="16" fill="#0F172A" opacity="0.1"/>

  <!-- Grinding Disc & Steel Guard -->
  <circle cx="160" cy="270" r="85" fill="#334155" stroke="#1E293B" stroke-width="2"/>
  <circle cx="160" cy="270" r="40" fill="#64748B"/>
  <circle cx="160" cy="270" r="14" fill="#0F172A"/>
  <!-- Safety Guard Semi-Circle -->
  <path d="M160,175 A95,95 0 0,1 255,270 L230,270 A70,70 0 0,0 160,200 Z" fill="#CBD5E1" stroke="#475569" stroke-width="2"/>

  <!-- Cast Aluminum Gear Head -->
  <polygon points="190,230 260,220 270,300 200,310" fill="#94A3B8" stroke="#1E293B" stroke-width="2"/>
  <circle cx="210" cy="245" r="8" fill="#DC2626"/>

  <!-- Auxiliary Side Handle -->
  <rect x="220" y="140" width="24" height="85" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>

  <!-- Main Motor Barrel Housing -->
  <path d="M260,220 L480,240 Q500,245 495,290 L270,300 Z" fill="url(#grindTeal)" stroke="#0F172A" stroke-width="2"/>
  <!-- Rear Toggle Switch & Vent Slots -->
  <rect x="470" y="255" width="22" height="15" rx="3" fill="#DC2626"/>
  <g stroke="#1E293B" stroke-width="2.5">
    <line x1="420" y1="245" x2="450" y2="248"/>
    <line x1="420" y1="255" x2="450" y2="258"/>
    <line x1="420" y1="265" x2="450" y2="268"/>
    <line x1="420" y1="275" x2="450" y2="278"/>
  </g>

  <!-- Technical Callout -->
  <text x="300" y="90" fill="#16706F" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="2">HEAVY-DUTY 4-INCH ANGLE GRINDER</text>
  <text x="300" y="110" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">BURST-PROOF GUARD • SPINDLE LOCK</text>
</svg>
