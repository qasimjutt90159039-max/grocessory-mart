<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Photographic Studio Floor Gradient -->
    <radialGradient id="studioLighting" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </radialGradient>

    <!-- Ambient Occlusion Shadow -->
    <radialGradient id="groundShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.4)" />
      <stop offset="60%" stop-color="rgba(15, 23, 42, 0.15)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0)" />
    </radialGradient>

    <!-- Brushed Stainless Steel Specular Gradient -->
    <linearGradient id="brushedChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="45%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#CBD5E1" />
      <stop offset="85%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Realistic Embossed Metal Diamond Plate Pattern -->
    <pattern id="photoDiamondTread" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M12,4 L16,8 L12,12 L8,8 Z" fill="#94A3B8" stroke="#FFFFFF" stroke-width="0.75" />
      <path d="M0,16 L4,20 L0,24 L-4,20 Z" fill="#94A3B8" stroke="#FFFFFF" stroke-width="0.75" />
      <path d="M24,16 L28,20 L24,24 L20,20 Z" fill="#94A3B8" stroke="#FFFFFF" stroke-width="0.75" />
      <line x1="0" y1="0" x2="24" y2="24" stroke="#475569" stroke-width="0.5" opacity="0.3" />
    </pattern>

    <!-- 3D Bevel Filter -->
    <filter id="softBevel" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>

    <linearGradient id="indicatorBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Red LED Filter -->
    <filter id="redLedBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Studio Photo Background -->
  <rect width="800" height="650" fill="url(#studioLighting)"/>

  <!-- Studio Grid Benchmark Overlay (Subtle) -->
  <line x1="50" y1="560" x2="750" y2="560" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.6"/>

  <!-- Realistic Multi-Layer Cast Ground Shadows -->
  <ellipse cx="440" cy="555" rx="280" ry="32" fill="url(#groundShadow)"/>
  <ellipse cx="420" cy="552" rx="210" ry="18" fill="rgba(15, 23, 42, 0.45)"/>

  <!-- PLATFORM BASE STRUCTURE -->
  <!-- Undercarriage Rim Frame -->
  <polygon points="180,450 670,450 600,545 110,545" fill="#334155" stroke="#1E293B" stroke-width="2"/>
  <!-- Front Edge Thickness -->
  <polygon points="110,545 600,545 600,565 110,565" fill="#1E293B"/>
  <polygon points="600,545 670,450 670,470 600,565" fill="#0F172A"/>

  <!-- 4 Cast Alloy Adjustable Leveling Feet with Rubber Base -->
  <rect x="130" y="565" width="34" height="15" rx="4" fill="#020617"/>
  <rect x="135" y="562" width="24" height="4" fill="#94A3B8"/>
  <rect x="560" y="565" width="34" height="15" rx="4" fill="#020617"/>
  <rect x="565" y="562" width="24" height="4" fill="#94A3B8"/>
  <rect x="200" y="468" width="28" height="12" rx="3" fill="#1E293B"/>
  <rect x="640" y="468" width="28" height="12" rx="3" fill="#1E293B"/>

  <!-- Weighing Pan Surface (Embossed Diamond Checker Steel with 3D bevel) -->
  <polygon points="185,453 665,453 595,543 115,543" fill="#94A3B8" filter="url(#softBevel)"/>
  <polygon points="185,453 665,453 595,543 115,543" fill="url(#photoDiamondTread)"/>

  <!-- Surface Light Highlight Strip (Specular Sheen) -->
  <polygon points="190,455 660,455 640,465 195,465" fill="#FFFFFF" opacity="0.35"/>

  <!-- Tubular Steel Backrest / Sack Support Frame -->
  <path d="M190,450 L190,260 Q190,250 200,250 L360,250 Q370,250 370,260 L370,450" fill="none" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
  <path d="M190,450 L190,260 Q190,250 200,250 L360,250 Q370,250 370,260 L370,450" fill="none" stroke="url(#brushedChrome)" stroke-width="8" stroke-linecap="round"/>

  <!-- Chrome Plated Indicator Support Post -->
  <rect x="210" y="110" width="28" height="360" rx="4" fill="url(#brushedChrome)" stroke="#475569" stroke-width="2"/>
  <rect x="216" y="110" width="8" height="360" fill="#FFFFFF" opacity="0.7"/>

  <!-- Heavy Cast Mounting Collar -->
  <polygon points="195,470 255,470 245,430 205,430" fill="#0F172A"/>
  <circle cx="225" cy="450" r="5" fill="#94A3B8"/>

  <!-- Flexible Shielded Black Sensor Cable Swirl -->
  <path d="M225,430 C200,400 250,300 225,230 C210,180 235,160 225,130" fill="none" stroke="#0F172A" stroke-width="7" stroke-linecap="round"/>
  <path d="M225,430 C200,400 250,300 225,230 C210,180 235,160 225,130" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

  <!-- DIGITAL INDICATOR HEAD (High Contrast Commercial Readout) -->
  <!-- Indicator Swivel Bracket -->
  <rect x="180" y="100" width="30" height="20" rx="3" fill="#334155"/>
  <circle cx="195" cy="110" r="4" fill="#CBD5E1"/>

  <!-- Main Ruggedized Enclosure -->
  <rect x="140" y="70" width="165" height="135" rx="12" fill="url(#indicatorBody)" stroke="#31AAA9" stroke-width="2.5" filter="url(#softBevel)"/>

  <!-- Chrome Screws in 4 Corners -->
  <circle cx="148" cy="78" r="3" fill="#94A3B8"/>
  <circle cx="297" cy="78" r="3" fill="#94A3B8"/>
  <circle cx="148" cy="197" r="3" fill="#94A3B8"/>
  <circle cx="297" cy="197" r="3" fill="#94A3B8"/>

  <!-- Recessed Glass Display Window with Gloss Sheen -->
  <rect x="152" y="82" width="141" height="68" rx="6" fill="#000000"/>
  <!-- Diagonal Glare on Glass -->
  <polygon points="152,82 220,82 185,150 152,150" fill="#FFFFFF" opacity="0.12"/>

  <!-- Bright Glowing 7-Segment Red LED Numbers -->
  <g filter="url(#redLedBloom)">
    <text x="278" y="132" fill="#EF4444" font-family="'JetBrains Mono', monospace" font-size="36" font-weight="900" text-anchor="end" letter-spacing="3">150.00</text>
  </g>
  <text x="160" y="100" fill="#31AAA9" font-family="sans-serif" font-size="10" font-weight="bold">kg</text>
  <text x="160" y="142" fill="#22C55E" font-family="sans-serif" font-size="8" font-weight="bold">● ZERO  ● TARE</text>

  <!-- Waterproof Membrane Push Buttons -->
  <g transform="translate(155, 160)">
    <rect x="0" y="0" width="24" height="16" rx="3" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="12" y="11" fill="#FFFFFF" font-size="8" font-weight="bold" text-anchor="middle">ZERO</text>

    <rect x="28" y="0" width="24" height="16" rx="3" fill="#334155" stroke="#475569" stroke-width="1"/>
    <text x="40" y="11" fill="#FFFFFF" font-size="8" font-weight="bold" text-anchor="middle">TARE</text>

    <rect x="56" y="0" width="24" height="16" rx="3" fill="#16706F" stroke="#31AAA9" stroke-width="1"/>
    <text x="68" y="11" fill="#FFFFFF" font-size="8" font-weight="bold" text-anchor="middle">M+</text>

    <rect x="84" y="0" width="24" height="16" rx="3" fill="#0284C7" stroke="#38BDF8" stroke-width="1"/>
    <text x="96" y="11" fill="#FFFFFF" font-size="8" font-weight="bold" text-anchor="middle">UNIT</text>

    <rect x="112" y="0" width="24" height="16" rx="3" fill="#DC2626" stroke="#EF4444" stroke-width="1"/>
    <text x="124" y="11" fill="#FFFFFF" font-size="8" font-weight="bold" text-anchor="middle">PWR</text>
  </g>

  <!-- Riveted Aluminum Manufacturer Serial Plate on Platform -->
  <g transform="translate(480, 520)">
    <rect x="0" y="0" width="90" height="20" rx="2" fill="#CBD5E1" stroke="#334155" stroke-width="1"/>
    <circle cx="4" cy="4" r="1.5" fill="#475569"/>
    <circle cx="86" cy="4" r="1.5" fill="#475569"/>
    <circle cx="4" cy="16" r="1.5" fill="#475569"/>
    <circle cx="86" cy="16" r="1.5" fill="#475569"/>
    <text x="45" y="13" fill="#0F172A" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="bold" text-anchor="middle">ATS MULTAN #553</text>
  </g>

  <!-- Professional Commercial Watermark -->
  <g transform="translate(560, 90)">
    <rect x="0" y="0" width="180" height="45" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" opacity="0.9" filter="url(#softBevel)"/>
    <text x="90" y="20" fill="#16706F" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="bold" text-anchor="middle">AALIYAN TRADER'S SCALES</text>
    <text x="90" y="34" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">MULTAN · ORIGINAL GEAR</text>
  </g>
</svg>
