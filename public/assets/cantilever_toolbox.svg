<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="boxSteel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#31AAA9"/>
      <stop offset="50%" stop-color="#16706F"/>
      <stop offset="100%" stop-color="#115E59"/>
    </linearGradient>
  </defs>

  <rect width="600" height="500" fill="#F8FAFC"/>
  <ellipse cx="300" cy="430" rx="200" ry="18" fill="#0F172A" opacity="0.12"/>

  <!-- Main Base Box Compartment -->
  <rect x="120" y="270" width="360" height="150" rx="10" fill="url(#boxSteel)" stroke="#0F172A" stroke-width="2.5"/>

  <!-- Upper Tier 1 Left and Right Cantilever Trays -->
  <rect x="100" y="210" width="180" height="55" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  <rect x="320" y="210" width="180" height="55" rx="6" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>

  <!-- Upper Tier 2 Cantilever Trays -->
  <rect x="80" y="150" width="190" height="55" rx="6" fill="#334155" stroke="#0F172A" stroke-width="2"/>
  <rect x="330" y="150" width="190" height="55" rx="6" fill="#334155" stroke="#0F172A" stroke-width="2"/>

  <!-- Steel Cantilever Connecting Linkage Arms -->
  <g stroke="#94A3B8" stroke-width="5" stroke-linecap="round">
    <line x1="130" y1="300" x2="110" y2="230"/>
    <line x1="110" y1="230" x2="90" y2="170"/>
    <line x1="470" y1="300" x2="490" y2="230"/>
    <line x1="490" y1="230" x2="510" y2="170"/>
  </g>
  <!-- Steel Pivot Rivets -->
  <circle cx="130" cy="300" r="4" fill="#0F172A"/>
  <circle cx="110" cy="230" r="4" fill="#0F172A"/>
  <circle cx="90" cy="170" r="4" fill="#0F172A"/>
  <circle cx="470" cy="300" r="4" fill="#0F172A"/>
  <circle cx="490" cy="230" r="4" fill="#0F172A"/>
  <circle cx="510" cy="170" r="4" fill="#0F172A"/>

  <!-- Tubular Full-Length Heavy Steel Carry Handles -->
  <path d="M150,140 C150,90 450,90 450,140" fill="none" stroke="#0F172A" stroke-width="12" stroke-linecap="round"/>
  <path d="M150,140 C150,90 450,90 450,140" fill="none" stroke="#CBD5E1" stroke-width="8" stroke-linecap="round"/>

  <!-- Heavy Duty Padlock Hasps -->
  <rect x="285" y="275" width="30" height="35" rx="4" fill="#CBD5E1" stroke="#0F172A" stroke-width="2"/>
  <circle cx="300" cy="295" r="5" fill="#0F172A"/>

  <!-- Technical Branding -->
  <text x="300" y="70" fill="#16706F" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">HEAVY-GAUGE 5-TRAY CANTILEVER TOOL BOX</text>
  <text x="300" y="90" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">COLD ROLLED SHEET STEEL • FULL WIDTH TUBULAR HANDLES</text>
</svg>
